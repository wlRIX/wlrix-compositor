[package]
name = "wlrix-compositor"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX Wayland compositor - recreates IRIX 4Dwm/Indigo Magic window management on Linux."
repository = "https://github.com/wlRIX/wlrix-compositor"
publish = false

[dependencies]
# Smithay provides the Wayland/DRM/GLES building blocks. Pinned to a *commit* rather than
# 0.7.0: `ext-image-copy-capture` (and `ext-image-capture-source`) only exist upstream, and
# screen sharing needs them. The API still moves, so the revision is exact -- bump it
# deliberately, never by re-resolving.
#   - winit  : nested backend (dev loop)
#   - udev/drm/gbm/egl/libinput/session_libseat : hardware backend
smithay = { git = "https://github.com/Smithay/smithay", rev = "5fb12b87407b3680135c45d94214c5f1b1d0fbea", default-features = false, features = [
    "backend_winit",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
    # X11 applications, run through XWayland
    "xwayland",
    "x11rb_event_source",
] }
# DrmScanner: connector enumeration + hotplug detection for the udev backend.
# `display-info` (EDID make/model) is disabled: it needs libdisplay-info <0.3, but
# current systems ship 0.3+. We only need the scanner.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "5fb12b87407b3680135c45d94214c5f1b1d0fbea", default-features = false }

libc = "0.2"
bitflags = "2.6"
# Window-title text on the server-side decorations: shaping + system-font fallback, so CJK
# and RTL titles render (the dev machine runs a Japanese locale).
cosmic-text = "0.12"
# System cursor theme loading (XCURSOR_THEME); we fall back to a built-in arrow.
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The compositor config (keyboard, display defaults) and the machine-written outputs
# state. TOML is wlRIX's config format throughout, so the compositor, session and
# greeter read the same shape of file.
serde = { version = "1", features = ["derive"] }
toml = "1"
# Generates the bespoke `wlrix-desks` protocol bindings from src/protocols/wlrix-desks.xml
# at compile time (no build.rs). Pinned to match the wayland-server 0.31 that Smithay
# re-exports, so the generated types unify with `smithay::reexports::wayland_server`.
wayland-scanner = "0.31"

# Only for `examples/test_locker.rs`, a throwaway screen locker used to exercise
# `ext-session-lock-v1`. Nothing in the compositor links against these.
[dev-dependencies]
wayland-client = "0.31"
# `unstable` is for `examples/test_pointer_constraints`: pointer-constraints and
# relative-pointer are both still `zwp_*` unstable protocols.
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# For `examples/test_wlr_toplevels`, which drives the wlr taskbar protocol as a client.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
