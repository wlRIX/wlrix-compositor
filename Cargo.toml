[package]
name = "wlrix-compositor"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX Wayland compositor - recreates IRIX 4Dwm/Indigo Magic window management on Linux."
repository = "https://github.com/wlRIX/wlrix-compositor"
publish = false

[dependencies]
# Smithay provides the Wayland/DRM/GLES building blocks. Pinned to 0.7.x since the
# API still moves.
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
] }

bitflags = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
