[package]
name = "wlrix-compositor"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX Wayland compositor - recreates IRIX 4Dwm/Indigo Magic window management on Linux."
repository = "https://github.com/wlRIX/wlrix-compositor"
publish = false

[dependencies]
# Smithay provides the Wayland/DRM/GLES building blocks. Pinned to 0.7.x since the
# API still moves.
#   - winit  : nested backend (dev loop)
#   - udev/drm/gbm/egl/libinput/session_libseat : hardware backend
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
    # X11 applications, run through XWayland
    "xwayland",
    "x11rb_event_source",
] }
# DrmScanner: connector enumeration + hotplug detection for the udev backend.
# `display-info` (EDID make/model) is disabled: it needs libdisplay-info <0.3, but
# current systems ship 0.3+. We only need the scanner.
smithay-drm-extras = { version = "0.1", default-features = false }

libc = "0.2"
bitflags = "2.6"
# System cursor theme loading (XCURSOR_THEME); we fall back to a built-in arrow.
xcursor = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Only for `examples/test_locker.rs`, a throwaway screen locker used to exercise
# `ext-session-lock-v1`. Nothing in the compositor links against these.
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
